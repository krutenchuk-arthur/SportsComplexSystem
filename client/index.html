<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sports Complex Control System</title>
    <script>
      // Тема застосовується до першого рендеру, щоб не було спалаху світлої теми
      try {
        if (localStorage.getItem('scs.theme') === 'dark') document.documentElement.classList.add('dark');
        if (localStorage.getItem('scs.density') === 'compact') document.documentElement.classList.add('density-compact');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
